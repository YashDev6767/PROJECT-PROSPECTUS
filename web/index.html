<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PROSPECTUS — course progression for Mirai School of Technology" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23047857'/%3E%3Cpath d='M9 22V10h7a4 4 0 010 8H9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>PROSPECTUS</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var mode = localStorage.getItem("prospectus.theme");
          var dark = mode === "dark" || ((mode === "system" || !mode) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
