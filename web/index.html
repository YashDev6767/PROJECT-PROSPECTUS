<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PROSPECTUS — course progression for Mirai School of Technology" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Crect x='6' y='18' width='4.5' height='8' rx='1.5' fill='%2360a5fa' opacity='0.7'/%3E%3Crect x='13.75' y='12' width='4.5' height='14' rx='1.5' fill='%233b82f6' opacity='0.9'/%3E%3Crect x='21.5' y='6' width='4.5' height='20' rx='1.5' fill='white'/%3E%3C/svg%3E" />
    <title>PROSPECTUS</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var mode = localStorage.getItem("prospectus.theme");
          var dark = mode === "dark" || ((mode === "system" || !mode) && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
