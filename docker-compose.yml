# Local PostgreSQL for PROSPECTUS. Usage: `npm run db:up`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prospectus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prospectus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prospectus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prospectus}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prospectus_pgdata:
